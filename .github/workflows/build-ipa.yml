name: Build IPA

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Unsigned IPA (iOS Device)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Moonlight for iOS Device
        run: |
          xcodebuild -project Moonlight.xcodeproj \
            -scheme Moonlight \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/Moonlight.app Payload/
          zip -r -9 Moonlight-AntiJitter.ipa Payload
          ls -lh Moonlight-AntiJitter.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-AntiJitter
          path: Moonlight-AntiJitter.ipa

      - name: Release IPA
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Moonlight-AntiJitter.ipa
          tag_name: ${{ github.ref_name }}
          name: Moonlight Anti-Jitter (${{ github.ref_name }})
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
